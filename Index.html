<meta name="color-scheme" content="dark">
<title>Dino Core | Discord</title>
<style>
:root{--bg:#000;--text:#fff;--muted:#8a8a8f;--line:#26262a;--accent:#2e9d4f;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;display:flex;align-items:center;justify-content:center;padding:24px;overflow:hidden;-webkit-font-smoothing:antialiased}
.glow{position:fixed;left:50%;top:50%;width:560px;height:560px;margin:-280px 0 0 -280px;border-radius:50%;background:radial-gradient(circle,rgba(46,157,79,.16),transparent 65%);pointer-events:none;animation:glow 2.4s .2s ease-out both}
main{position:relative;text-align:center;max-width:380px;width:100%}
.logo{display:block;width:104px;height:104px;margin:0 auto 32px;border-radius:50%;object-fit:cover;border:1px solid var(--line);animation:logo 1s cubic-bezier(.2,.8,.2,1) both}
h1{margin:0 0 14px;font-size:2.4rem;font-weight:600;letter-spacing:-.03em;line-height:1.1;animation:up .9s .25s cubic-bezier(.2,.8,.2,1) both}
.desc{margin:0;font-size:1.05rem;color:#d4d4d8;animation:up .9s .4s cubic-bezier(.2,.8,.2,1) both}
.rule{height:1px;width:48px;margin:28px auto;background:var(--line);transform-origin:center;animation:line .9s .6s cubic-bezier(.2,.8,.2,1) both}
.tag{margin:0 0 36px;font-size:.78rem;letter-spacing:.22em;text-transform:uppercase;color:var(--muted);animation:up .9s .75s cubic-bezier(.2,.8,.2,1) both}
.btn{display:inline-flex;align-items:center;gap:10px;background:#fff;color:#000;text-decoration:none;font-weight:600;font-size:.98rem;padding:14px 28px;border-radius:999px;transition:background .2s,gap .2s;animation:up .9s .9s cubic-bezier(.2,.8,.2,1) both}
.btn:hover{background:#e4e4e7;gap:14px}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.btn svg{width:16px;height:16px}
footer{position:fixed;left:0;right:0;bottom:calc(22px + env(safe-area-inset-bottom,0px));text-align:center;font-size:.75rem;letter-spacing:.06em;color:var(--muted);animation:fade 1.2s 1.3s ease both}
footer span{color:#d4d4d8}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes up{from{opacity:0;transform:translateY(22px);filter:blur(6px)}to{opacity:1;transform:none;filter:none}}
@keyframes logo{from{opacity:0;transform:scale(.8);filter:blur(10px)}to{opacity:1;transform:none;filter:none}}
@keyframes line{from{opacity:0;transform:scaleX(0)}to{opacity:1;transform:scaleX(1)}}
@keyframes glow{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important}}
</style>
</head>
